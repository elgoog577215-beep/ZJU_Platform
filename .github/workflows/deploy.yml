name: CI/CD

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

permissions:
    contents: read

env:
    NODE_VERSION: "22"
    PRODUCTION_URL: https://tuotuzju.com

jobs:
    validate:
        name: Validate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install frontend dependencies
              run: npm ci --ignore-scripts --legacy-peer-deps

            - name: Validate source and changed-file formatting
              env:
                  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
              run: |
                  set -euo pipefail
                  npm run lint
                  diff_base="${BASE_SHA:-}"
                  zero_sha="0000000000000000000000000000000000000000"
                  if [ -z "$diff_base" ] || [ "$diff_base" = "$zero_sha" ] || ! git cat-file -e "${diff_base}^{commit}" 2>/dev/null; then
                    if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
                      diff_base="$(git rev-parse HEAD^)"
                    else
                      diff_base=""
                    fi
                  fi

                  changed_files=()
                  if [ -n "$diff_base" ]; then
                    while IFS= read -r file; do
                      case "$file" in
                        *.css|*.html|*.js|*.jsx|*.json|*.json5|*.md|*.mdx|*.scss|*.ts|*.tsx|*.vue|*.yaml|*.yml)
                          changed_files+=("$file")
                          ;;
                      esac
                    done < <(git diff --name-only --diff-filter=ACMR "$diff_base" "$GITHUB_SHA" --)
                    git diff --check "$diff_base" "$GITHUB_SHA"
                  else
                    while IFS= read -r file; do
                      case "$file" in
                        *.css|*.html|*.js|*.jsx|*.json|*.json5|*.md|*.mdx|*.scss|*.ts|*.tsx|*.vue|*.yaml|*.yml)
                          changed_files+=("$file")
                          ;;
                      esac
                    done < <(git diff-tree --no-commit-id --name-only --diff-filter=ACMR -r "$GITHUB_SHA")
                    git diff-tree --check --no-commit-id -r "$GITHUB_SHA"
                  fi

                  if [ "${#changed_files[@]}" -gt 0 ]; then
                    npx prettier --check "${changed_files[@]}"
                  else
                    echo "No Prettier-supported files changed; formatting check skipped."
                  fi

    test:
        name: Test
        runs-on: ubuntu-latest
        needs: validate
        env:
            NODE_ENV: test
            SECRET_KEY: ci-test-secret
            JWT_SECRET: ci-test-jwt-secret
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install dependencies
              run: |
                  npm ci --ignore-scripts --legacy-peer-deps
                  npm ci --prefix server --legacy-peer-deps

            - name: Run backend test suite
              run: node --test --test-concurrency=1 server/tests/*.test.js

    build:
        name: Build dist
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install frontend dependencies
              run: npm ci --ignore-scripts --legacy-peer-deps

            - name: Build frontend
              run: |
                  npm run build
                  npm run check:frontend-assets
                  npm run check:startup-chunks

            - name: Upload built frontend artifact
              uses: actions/upload-artifact@v7
              with:
                  name: frontend-dist-${{ github.sha }}
                  path: dist
                  if-no-files-found: error
                  retention-days: 14

    package:
        name: Package release artifact
        runs-on: ubuntu-latest
        needs: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Download built frontend
              uses: actions/download-artifact@v8
              with:
                  name: frontend-dist-${{ github.sha }}
                  path: frontend-dist

            - name: Create immutable release package
              env:
                  RELEASE_ID: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  package_root="$RUNNER_TEMP/zju-platform-package"
                  rm -rf "$package_root" release
                  mkdir -p "$package_root/payload" release

                  server_archive="$package_root/server.tar"
                  git archive --format=tar --output="$server_archive" HEAD server shared
                  tar -xf "$server_archive" -C "$package_root/payload"
                  rm -f "$server_archive"
                  frontend_dist=frontend-dist
                  if [ ! -f "$frontend_dist/index.html" ] && [ -f "$frontend_dist/dist/index.html" ]; then
                    frontend_dist="$frontend_dist/dist"
                  fi
                  test -f "$frontend_dist/index.html"
                  test -s "$frontend_dist/images/hero-landscape-day-4k.jpg"
                  test -s "$frontend_dist/images/hero-landscape-night.jpg"
                  test -s "$frontend_dist/images/hero-background.jpg"
                  test -s "$frontend_dist/images/hero-campus-day-4k.jpg"
                  test -s "$frontend_dist/images/partner-logos/getui.svg"
                  test -s "$frontend_dist/images/partner-logos/getui-dark.svg"
                  test -s "$frontend_dist/images/partner-logos/organizations/official/zhejiang-university.png"
                  test -s "$frontend_dist/images/partner-logos/organizations/official/xlab.svg"
                  test -s "$frontend_dist/images/partner-logos/organizations/official/xlab-white.svg"
                  test -s "$frontend_dist/images/partner-logos/organizations/official/zjuai.webp"
                  cp -a "$frontend_dist" "$package_root/payload/dist"

                  rm -rf "$package_root/payload/server/node_modules"
                  rm -rf "$package_root/payload/server/uploads"
                  rm -rf "$package_root/payload/server/logs"
                  rm -rf "$package_root/payload/server/data"
                  rm -rf "$package_root/payload/server/backups"
                  find "$package_root/payload/server" -maxdepth 1 -type f -name 'database.sqlite*' -delete

                  printf '%s\n' \
                    "commit=$RELEASE_ID" \
                    "ref=$GITHUB_REF" \
                    "run=$GITHUB_RUN_ID" \
                    "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                    > "$package_root/payload/release-manifest.txt"

                  cp deploy/deploy-release.sh release/deploy-release.sh
                  archive="release/zju-platform-${RELEASE_ID}.tar.gz"
                  tar -C "$package_root" -czf "$archive" payload
                  archive_contents="$package_root/archive.list"
                  tar -tzf "$archive" > "$archive_contents"
                  grep -Fq 'payload/dist/index.html' "$archive_contents"
                  grep -Fq 'payload/server/index.js' "$archive_contents"
                  grep -Fq 'payload/shared/hackathonTemplateDefaults.json' "$archive_contents"
                  rm -f "$archive_contents"
                  (cd release && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")

            - name: Upload immutable release artifact
              uses: actions/upload-artifact@v7
              with:
                  name: release-${{ github.sha }}
                  path: release/*
                  if-no-files-found: error
                  retention-days: 30

    deploy:
        name: Deploy release artifact
        runs-on: ubuntu-latest
        needs: package
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.ZJU_DEPLOY_TRANSPORT != 'local'
        concurrency:
            group: zju-production-deploy
            cancel-in-progress: false
        environment:
            name: production
            url: https://tuotuzju.com
        steps:
            - name: Download immutable release artifact
              uses: actions/download-artifact@v8
              with:
                  name: release-${{ github.sha }}
                  path: release

            - name: Upload release artifact to server
              uses: appleboy/scp-action@v1.0.0
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  source: "release/*"
                  target: "/tmp/zju-platform/"
                  overwrite: true

            - name: Deploy artifact, Caddy, and PM2
              uses: appleboy/ssh-action@v1.2.5
              env:
                  ZJU_QWEN_BASE_URL: ${{ secrets.ZJU_QWEN_BASE_URL }}
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  envs: ZJU_QWEN_BASE_URL
                  script: |
                      bash /tmp/zju-platform/release/deploy-release.sh '${{ github.sha }}'

    verify:
        name: HTTPS smoke test
        runs-on: ubuntu-latest
        needs: deploy
        if: success()
        steps:
            - name: Verify production contract
              run: |
                  set -euo pipefail
                  curl --fail --silent --show-error --retry 5 --retry-delay 2 \
                    "$PRODUCTION_URL/api/health" > /tmp/zju-health.json
                  curl --fail --silent --show-error --retry 5 --retry-delay 2 \
                    "$PRODUCTION_URL/api/projects?limit=1" > /tmp/zju-projects.json
                  curl --fail --silent --show-error --retry 5 --retry-delay 2 \
                    "$PRODUCTION_URL/projects" > /tmp/zju-projects.html
                  curl --fail --silent --show-error --retry 5 --retry-delay 2 \
                    "$PRODUCTION_URL/api/ecosystem-partners" > /tmp/zju-ecosystem-partners.json
                  for asset in images/hero-landscape-day-4k.jpg images/hero-landscape-night.jpg images/hero-background.jpg images/hero-campus-day-4k.jpg; do
                    asset_headers="/tmp/zju-asset-headers"
                    asset_body="/tmp/zju-asset"
                    curl --fail --silent --show-error --retry 5 --retry-delay 2 \
                      -D "$asset_headers" -o "$asset_body" "$PRODUCTION_URL/$asset"
                    grep -Eiq '^content-type:[[:space:]]*image/jpeg([;[:space:]]|$)' "$asset_headers"
                    test -s "$asset_body"
                  done
                  for asset in images/partner-logos/getui.svg images/partner-logos/getui-dark.svg images/partner-logos/organizations/official/zhejiang-university.png images/partner-logos/organizations/official/xlab.svg images/partner-logos/organizations/official/xlab-white.svg images/partner-logos/organizations/official/zjuai.webp; do
                    curl --fail --silent --show-error --retry 5 --retry-delay 2 \
                      -o /tmp/zju-partner-logo "$PRODUCTION_URL/$asset"
                    test -s /tmp/zju-partner-logo
                  done
                  node <<'NODE'
                  const fs = require("node:fs");
                  const partners = JSON.parse(
                    fs.readFileSync("/tmp/zju-ecosystem-partners.json", "utf8")
                  );
                  const expected = new Map([
                    ["未来学习中心", "zhejiang-university.png"],
                    ["XLAB", "xlab.svg"],
                    ["ZJUAI", "zjuai.webp"],
                    ["每日互动", "getui.svg"],
                  ]);
                  for (const [name, logoSuffix] of expected) {
                    const partner = partners.find((item) => item.name === name);
                    if (!partner || !String(partner.logo_url || "").endsWith(logoSuffix)) {
                      throw new Error(`Missing production partner logo: ${name} -> ${logoSuffix}`);
                    }
                  }
                  NODE

            - name: Verify production self-hosted Qwen path
              run: |
                  set -euo pipefail
                  curl --fail --silent --show-error --max-time 45 \
                    --retry 2 --retry-all-errors --retry-delay 2 \
                    -H 'content-type: application/json' \
                    --data '{"query":"我想看看近期适合学生参加的人工智能活动","allowHistoricalFallback":true,"visitorKey":"production-qwen-deploy-check"}' \
                    "$PRODUCTION_URL/api/events/assistant" > /tmp/zju-event-assistant.json
                  node <<'NODE'
                  const fs = require("node:fs");
                  const response = JSON.parse(
                    fs.readFileSync("/tmp/zju-event-assistant.json", "utf8")
                  );
                  const status = response.modelStatus || {};
                  if (status.used !== true || status.model !== "qwen3.8-27b") {
                    throw new Error("Production activity assistant did not use exact self-hosted Qwen.");
                  }
                  if (Array.isArray(status.fallbackAttempts) && status.fallbackAttempts.length > 0) {
                    throw new Error("Production activity assistant reported provider fallback attempts.");
                  }
                  const usedStatuses = [status, ...(status.profileModelStatuses || [])].filter(
                    (item) => item?.used === true
                  );
                  if (usedStatuses.some((item) => item.model !== "qwen3.8-27b")) {
                    throw new Error("Production activity assistant reported a different text model.");
                  }
                  console.log("Production self-hosted Qwen path verified.");
                  NODE
