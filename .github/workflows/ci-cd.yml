name: Quality Checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - develop
  push:
    branches:
      - "feat/**"
      - "hotfix/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Install backend dependencies
        run: npm --prefix server ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Check startup chunks
        run: npm run check:startup-chunks

      - name: Run platform foundation test
        run: npm run test:foundation
